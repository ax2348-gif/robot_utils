# Remote access to the robot through erid (nginx site; install.sh puts it in /etc/nginx/sites-enabled/).
#
# Remote people open http://<erid's Tailscale name>/ and get the whole robot UI and API. erid pays the Tailscale
# (WireGuard) encryption; the Pi only sends plain HTTP over the robot LAN to erid, as for any LAN client.
# Plain pass-through: every remote request is still one request to the Pi (no fan-out).
#
# Only Tailscale addresses may connect: erid's wired NIC is on the campus network and the robot API has no
# authentication. Robot-LAN clients should talk to the Pi directly (botcore-desktop.local), not through here.
#
# Identity: each request asks robot-whois (127.0.0.1:8098, `tailscale whois`, cached) who the Tailscale client is
# and forwards it as X-Robot-User / -Name / -Device; the client's address goes last in X-Forwarded-For. The robot
# trusts both only from this machine's LAN address (its nginx: remote_proxies in nodes.yaml).

upstream robot_pi {
    # the Pi on the robot LAN by address, NOT a Tailscale name (that would send the traffic back through
    # Tailscale and encrypt it on the Pi). Keep the Pi's DHCP lease reserved on the robot router.
    server 192.168.8.209:80;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    allow 100.64.0.0/10;          # Tailscale IPv4
    allow fd7a:115c:a1e0::/48;    # Tailscale IPv6
    allow 127.0.0.1;
    deny all;

    client_max_body_size 64m;
    send_timeout 1d;
    gzip off;

    location = /_robot_whois {
        internal;
        proxy_pass http://127.0.0.1:8098/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Client-IP $remote_addr;
        proxy_connect_timeout 1s;
        proxy_read_timeout 4s;
    }

    location / {
        auth_request /_robot_whois;
        auth_request_set $ts_user $upstream_http_x_ts_user;
        auth_request_set $ts_name $upstream_http_x_ts_name;
        auth_request_set $ts_device $upstream_http_x_ts_device;
        # robot-whois down: auth_request fails with 500 here (upstream errors pass through untouched,
        # proxy_intercept_errors is off), and the request goes on without identity
        error_page 500 = @no_identity;

        proxy_set_header X-Robot-User $ts_user;
        proxy_set_header X-Robot-Name $ts_name;
        proxy_set_header X-Robot-Device $ts_device;
        include /etc/nginx/robot-remote-proxy.inc;
    }

    location @no_identity {
        include /etc/nginx/robot-remote-proxy.inc;
    }
}
