# The rings sorting scene with the dynamic arm (sim_rings.yaml + sim_dynamic_arm.yaml; docs/sim.md):
#   ROBOT_SIM_CONFIG=deploy/sim/sim_rings_dynamic.yaml python -m robot_utils.nodes.sim.stack
scene:
  tabletop: false
  rings: true
components:
  arm:
    fidelity: dynamic
# 80 objects: MuJoCo's no-slip post-solve doubles the step (1.65 -> 0.74 ms per 1 ms step, measured 2026-11-24), so it
# is off for this scene; grasps still hold (dynamic arm, lift + shake: slip 1.2-1.3 mm vs 0.5 with it, 5 mm before
# the jaw fix; tests/test_sim_grasp_hold.py)
contact:
  noslip_iterations: 0
