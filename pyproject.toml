[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-utils"
version = "0.1.0"
description = "One environment for the robot: REV SPARK, reBot arm and motorbridge control, plus LeRobot"
readme = "README.md"
requires-python = ">=3.12"  # LeRobot >= 0.5 needs 3.12
# The first three are the submodules. install.sh puts them in place before this package
# (motorbridge as the fork's prebuilt wheel, the others editable), so pip finds them already
# satisfied; constraints.txt stops anything from replacing the fork's motorbridge with PyPI's.
dependencies = [
    "sparkcan",                # rev_ctl
    "rebotarm-control-py",     # rebot_ctl
    "motorbridge>=0.5.6",      # motorbridge_2ec (fork with non-blocking encoder reads)
    "lerobot",                 # no extras by default
    # Nodes (src/robot_utils/nodes) and the landing frontend (src/robot_utils/frontend)
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # uvicorn's "auto" loop/http pick these when importable (25-35 % less server CPU per request
    # than asyncio + h11, lower stream tail latency on the Pi); not uvicorn[standard], whose
    # watchfiles / websockets / dotenv the nodes don't use
    "uvloop>=0.19; sys_platform != 'win32'",
    "httptools>=0.6.3",
    "httpx>=0.27",
    "pyyaml>=6",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
# page previews and visual safety checks (robot_utils.dev.preview); then: python -m playwright install chromium
dev = ["playwright>=1.40"]
# the power node's UPS HAT on I2C (robot_utils.nodes.power); optional: the node reports the HAT as
# unavailable without it, and --fake never needs it
power = ["smbus2>=0.4"]
# the MuJoCo sim world (robot_utils.nodes.sim, docs/plans/sim_v1.md); development machines and erid, never the robot
sim = ["mujoco>=3.2"]
# whole-body control (robot_utils.nodes.wbc): pinocchio kinematics and the daqp QP (installed on the robot, 2026-11-21:
# pin 4.1.0, qpsolvers 4.13.0, daqp 0.11.2)
wbc = ["pin>=4.1", "qpsolvers>=4.13", "daqp>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"robot_utils.frontend" = ["nodes.yaml", "page.html", "tools/*.html", "themes/*.css"]
"robot_utils.nodes.description" = ["default_description.yaml"]
"robot_utils.nodes.sim" = ["default_sim.yaml", "stack_nodes.yaml"]
"robot_utils.nodes.agent_interface" = ["guide.md"]
"robot_utils.nodes.common" = ["fonts/*"]

[tool.pytest.ini_options]
# only our tests: a bare `pytest` from the repo root would otherwise collect the submodules' scripts
# (rebot_ctl/tools/gravity_calibration/auto_float_test.py crashes collection)
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]   # first party: robot_utils and the tests' helper modules (helpers.py, *_fakes.py, ...)
extend-exclude = ["motorbridge_2ec", "rebot_ctl", "rev_ctl"]

[tool.ruff.lint]
# Conservative: pyflakes, pycodestyle errors/warnings, import order. The codebase is not
# mass-reformatted to this; fix what you touch.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # long lines: one-line endpoint decorators, docstrings and HTML/JS strings run long on purpose
    "E702",   # `a; b` on one line (~500 places, src and tests)
    "E731",   # small lambdas bound to names (~35)
    "E741",   # `l`, `I` as names in maths
]
