[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-utils"
version = "0.1.0"
description = "One environment for the robot: REV SPARK, reBot arm and motorbridge control, plus LeRobot"
readme = "README.md"
requires-python = ">=3.12"  # LeRobot >= 0.5 needs 3.12
# The first three are the submodules. install.sh puts them in place before this package
# (motorbridge as the fork's prebuilt wheel, the others editable), so pip finds them already
# satisfied; constraints.txt stops anything from replacing the fork's motorbridge with PyPI's.
dependencies = [
    "sparkcan",                # rev_ctl
    "rebotarm-control-py",     # rebot_ctl
    "motorbridge>=0.5.6",      # motorbridge_2ec (fork with non-blocking encoder reads)
    "lerobot",                 # no extras by default
    # Nodes (src/robot_utils/nodes) and the landing frontend (src/robot_utils/frontend)
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # uvicorn's "auto" loop/http pick these when importable (25-35 % less server CPU per request
    # than asyncio + h11, lower stream tail latency on the Pi); not uvicorn[standard], whose
    # watchfiles / websockets / dotenv the nodes don't use
    "uvloop>=0.19; sys_platform != 'win32'",
    "httptools>=0.6.3",
    "httpx>=0.27",
    "pyyaml>=6",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
# page previews and visual safety checks (robot_utils.dev.preview); then: python -m playwright install chromium
dev = ["playwright>=1.40"]
# the power node's UPS HAT on I2C (robot_utils.nodes.power); optional: the node reports the HAT as
# unavailable without it, and --fake never needs it
power = ["smbus2>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"robot_utils.frontend" = ["nodes.yaml", "page.html", "tools/*.html", "themes/*.css"]
"robot_utils.nodes.description" = ["default_description.yaml"]
"robot_utils.nodes.agent_nav" = ["guide.md"]
"robot_utils.nodes.common" = ["fonts/*"]
