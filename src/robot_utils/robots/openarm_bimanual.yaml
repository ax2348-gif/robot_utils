# OpenArm v2 with the Anvil gripper and ranges, Enactic J1 window: the bimanual on the swerve base (sim only;
# robots/openarm/README.md, docs/plans/bimanual_and_robot_swap.md "How the OpenArm torso slots in"). Two 7-DOF arms:
# Enactic's OpenArm v2.0 (enactic/openarm_description, Apache-2.0: links, meshes, inertials) with the Anvil OpenArm
# 2.0's joint ranges (J6 left -45..+70 deg, right -70..+45) and Anvil's gripper (robots/grippers.py ``anvil``: 0-100 mm,
# 150 N rated / 350 N max), generated by robots/openarm/build_urdf.py; J1 keeps Enactic's window (right -80..+200 deg,
# left -200..+80: the window's position is a mounting choice; Enactic's keeps the overhead forward reach).
#
# Mounting, human scale (owner's rule, 2026-11-24): the shoulders at the shoulder height of a human whose arms are
# OpenArm's size. OpenArm's upper arm (shoulder centre = joint2's origin to the elbow = joint4's) is 0.220 m and its
# forearm (elbow to the wrist centre = joint6's origin) 0.216 m (the URDF). Winter's anthropometric segment lengths
# (D. A. Winter, Biomechanics and Motor Control of Human Movement, 4th ed., 2009, Fig. 4.1; after Drillis & Contini
# 1966): upper arm 0.186 H, forearm 0.146 H, shoulder height 0.818 H. Shoulder to wrist: 0.436 m = 0.332 H, so
# H = 1.313 m and the shoulder height 0.818 H = 1.074 m (from the upper arm alone H would be 1.18 m, from the forearm
# 1.48 m: OpenArm's forearm is long for its upper arm; the sum is the rule's "shoulder to wrist"). The shoulder centre
# lies in the plane of each arm's base_link (joint1's axis meets joint2's origin there), so base_link z = 1.074 m.
# x = 0.12 m (the torso on the base's front half), y = +-0.03 m (where OpenArm's body places its arms relative to its
# centre line; the shoulder centres then 0.306 m apart). For comparison OpenArm's own body on our base would put them
# at 0.92 m: Enactic's own v2 example URDF mounts the arm base_links 0.697 m above openarm_body_link0, +-0.03 m. (Enactic's
# "160-165 cm" human-size claim is not tied to a dimension.) The work surface (table top, rings) follows:
# scene.work_top below.
doc: OpenArm v2 (Enactic) with Anvil's joint ranges and gripper, Enactic J1 window; bimanual on the swerve base, human-scale mount (sim only)
sim_only: true
description:
  extends: rebot
  overlay:
    frames:
      arm: null
      arm_left:
        parent: base
        xyz: [0.12, 0.03, 1.074]
        rpy: [0.0, 0.0, 0.0]
        doc: left arm base (OpenArm base_link), its body-side mount; axes as base
      arm_right:
        parent: base
        xyz: [0.12, -0.03, 1.074]
        rpy: [0.0, 0.0, 0.0]
        doc: right arm base (OpenArm base_link), its body-side mount; axes as base
    cameras:
      camera:
        nominal:
          # at the human's eye height (Winter: 0.936 H = 1.229 m), over the torso, pitched 40 deg down onto the work
          # surface (0.70 m) ahead of the base
          xyz: [0.12, 0.0, 1.229]
          rpy: [-2.2689280, 0.0, -1.5707963]
    components:
      arm: null
      torso:
        source: procedural
        type: box
        parent: base_link
        mount: {xyz: [0.12, 0.0, 0.6032], rpy: [0.0, 0.0, 0.0]}   # 0.222 (the base's top) .. 0.984 m (the block)
        size: [0.06, 0.06, 0.7618]
        mass: 3.0                                  # ESTIMATE (OpenArm's body: 3.73 kg with its base plate)
        doc: torso column (stands in for OpenArm's body column)
      shoulders:
        source: procedural
        type: box
        parent: base_link
        mount: {xyz: [0.12, 0.0, 1.074], rpy: [0.0, 0.0, 0.0]}  # centred on the shoulders: 0.984 .. 1.164 m
        size: [0.15, 0.06, 0.18]                   # OpenArm's chest cover, about
        mass: 0.7                                  # ESTIMATE
        doc: shoulder block (OpenArm's chest cover, about); the arms' base_links on its sides
      arm_left:
        source: urdf
        file: robot_utils:robots/openarm/urdf/openarm_v2_left_arm.urdf
        prefix: arm_left_
        parent: base_link
        mount: {frame: arm_left}
        frame: arm_left
        doc: OpenArm v2 left arm (7 DOF; Enactic's, Anvil's ranges), Anvil gripper
      arm_right:
        source: urdf
        file: robot_utils:robots/openarm/urdf/openarm_v2_right_arm.urdf
        prefix: arm_right_
        parent: base_link
        mount: {frame: arm_right}
        frame: arm_right
        doc: OpenArm v2 right arm (7 DOF; Enactic's, Anvil's ranges), Anvil gripper
      wrist_camera:
        parent: arm_right_end_link
        # Anvil's wrist camera frame (its wrist_cam on the hand, in end_link; robots/openarm/README.md "The gripper"):
        # above the jaws (end_link +z), 93.5 mm behind the fingertips, looking out along end_link x tilted 47 deg down
        # onto the jaws. The hand's mesh draws the camera; its mass is in the hand's 0.7 kg
        mount: {xyz: [-0.0935, -0.001, 0.074], rpy: [-2.3963, 0.0, -1.5707963]}
        size: [0.036, 0.03, 0.03]
        mass: 0.001
        doc: wrist camera on Anvil's hand (its wrist_cam frame)
    arms:
      arm_left:
        side: left
        type: openarm_v2
        joints: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
        # the nominal posture (the start pose, the WBC's "ready" / null_mode nominal): fingertips 0.34 m ahead of and
        # 0.30 m below the shoulder (0.77 m up: 7 cm over the 0.70 m work surface), 0.17 m out, the tool pitched 50 deg
        # down from forward (straight down needs a ~80 deg wrist bend: joint7 then sits 0.2 rad from its limit and the
        # elbow can hardly swivel), the elbow out (0.29 m from the centre line) and 0.13 m below the shoulder, every
        # joint >= 20 % of its range from its limits (20.7 %), the wrist camera's side (end_link z) at most 12 deg below
        # horizontal, so the hand clears the table. Re-solved for Anvil's J6 range (2026-11-25): the previous posture
        # (the jaws in the sagittal plane, the camera turned inward) leaves Anvil's wrist at 9 % of its range, and that
        # hand pose at best at 17.7 % (whose null-space swivel then runs the wrist into its limits: the WBC's swivel
        # tests fail there); the jaws are now turned 19 deg about the tool from it
        # the owner's pose (2026-11-26): the upper arm straight down, the forearm horizontal forward (elbow 90 deg),
        # the tool forward with the wrist camera's side (end_link z) up: the zero pose with joint4 at 90 deg; J2 is
        # then 10 deg from its limit (the arm along the body). Was [-0.244, -0.894, 0.616, 1.868, 0.906, -0.370, -0.920]
        posture: [0.0, 0.0, 0.0, 1.5708, 0.0, 0.0, 0.0]
        tcp: [-0.0225, 0.0, 0.0]                   # the grasp point: Anvil's hand_tcp (robots/grippers.py anvil)
      arm_right:
        side: right
        type: openarm_v2
        joints: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
        posture: [0.0, 0.0, 0.0, 1.5708, 0.0, 0.0, 0.0]
        tcp: [-0.0225, 0.0, 0.0]
sim:
  scene:
    # the work surface (table top, rings) at human scale: a standing light-work surface 10-15 cm below the elbow
    # (ergonomics, e.g. Grandjean, Fitting the Task to the Man); this human's elbow is at 0.818 H - 0.186 H = 0.632 H
    # = 0.83 m, so 0.70 m. Reach there (fingertips 0-5 cm above it, the tool within 45 deg of down; sampled): x up to
    # 0.63 m ahead of the base centre, 95 % within 0.44 m; at the reBot's 0.302 m the fingertips do not reach the
    # surface ahead of the base at all (lowest ~0.44 m)
    work_top: 0.70
  components:
    arms:
      # 7 joints: the start pose (the nominal posture) and the motors' estimates per joint (DM8009, DM8009, DM4340,
      # DM4340, DM4310 x 3: the reBot's 4340 / 4310 values, the 8009 as the 4340 x 1.5; ESTIMATES)
      arm_left:
        start_q: [0.0, 0.0, 0.0, 1.5708, 0.0, 0.0, 0.0]
        dynamic:
          armature: [0.045, 0.045, 0.03, 0.03, 0.001, 0.001, 0.001]
          viscous: [0.15, 0.15, 0.1, 0.1, 0.02, 0.02, 0.02]
          coulomb: [0.5, 0.5, 0.4, 0.4, 0.05, 0.05, 0.05]
      arm_right:
        start_q: [0.0, 0.0, 0.0, 1.5708, 0.0, 0.0, 0.0]
        dynamic:
          armature: [0.045, 0.045, 0.03, 0.03, 0.001, 0.001, 0.001]
          viscous: [0.15, 0.15, 0.1, 0.1, 0.02, 0.02, 0.02]
          coulomb: [0.5, 0.5, 0.4, 0.4, 0.05, 0.05, 0.05]
stack:
  without: []
# the WBC's config defaults for this robot (wbc/spec.py Config; the node's --config overrides them): the soft
# arm-proximity term between the two arms' upper-arm / forearm capsules (wbc/humanlike.py; off by default, and off
# with one arm). Strictly short range: zero beyond 5 cm of clearance; weight 30 over the swivel's 1 (docs/wbc.md)
wbc:
  # the base's linear acceleration cap (m/s²; the default 2.0): the tall human-scale torso tips at 2 (the owner, 2026-11-25)
  max_accel: 1.0
  w_arm_proximity: 30.0
  proximity_clearance: 0.05
  # the swivel model's head and torso points (base_link), at the human scale above (H = 1.313 m; Winter): the eyes
  # at 0.936 H = 1.229 m, the torso's centre (mid-chest, between the shoulders 0.818 H and the hips 0.530 H) ~0.95 m
  swivel_head: [0.12, 0.0, 1.229]
  swivel_torso: [0.12, 0.0, 0.95]
