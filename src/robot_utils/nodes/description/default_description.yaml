# Default (nominal) robot description, shipped with the code. The node's live state (measured
# poses you set through the API, calibrations) lives in ~/.local/share/robot_utils/description/
# (--data-dir), never in this checkout.
#
# Frames: a flat map, each naming its parent. A frame's pose in its parent: p_parent = R p_child + t,
# with rpy = fixed-axis X, Y, Z (as URDF: R = Rz(yaw) Ry(pitch) Rx(roll)), radians, xyz in metres.
frames:
  base:
    parent: null
    doc: floor level, centre of the wheels; x forward, y left, z up
  arm:
    parent: base
    # The ReBot arm's base_link (rebot_ctl/urdf/DM/urdf/ReBot_Arm_DM_mount_right.urdf): the underside of its
    # 200 x 140 mm mount plate (200 along x), at the plate centre on joint 1's axis; axes = base axes (the
    # URDF turns the mount, not the frame). The plate sits on the robot's top surface (8.75 in) in the
    # front-right corner, flush with the front and right outer faces of the 17 in frame:
    #   x = 8.5 in - 0.100, y = -(8.5 in - 0.070), z = 8.75 in.
    xyz: [0.1159, -0.1459, 0.22225]
    rpy: [0.0, 0.0, 0.0]
    doc: arm base (ReBot base_link), mount plate underside on joint 1's axis; axes as base

# Cameras: one entry per camera node instance (`node`: its instance name on this machine, reached
# through its unix socket; or `url` for a remote / debug one). Its frames (depth_optical, color_optical, imu)
# come from that node's GET /description and hang under "<name>/depth_optical", whose pose in
# base is: the nominal pose below, refined by the active calibrations (ground plane: roll, pitch,
# height; motion: yaw). x and y are never calibrated: measure them and set them with
# POST /cameras/<name>/nominal.
cameras:
  camera:
    node: camera
    nominal:
      xyz: [0.0, 0.0, 0.5]                    # measure (tape)
      rpy: [-1.5707963, 0.0, -1.5707963]      # optical axis forward, image up = base up
