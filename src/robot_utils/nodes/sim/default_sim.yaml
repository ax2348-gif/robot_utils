# The sim world's configuration: what the URDF lacks (docs/sim.md). Override any key with --config FILE
# (merged over this one). Units: m, rad, s, kg, N, N m.

physics:
  timestep: 0.001                # s (1 kHz)
  integrator: implicitfast       # implicitfast | implicit | euler | rk4
  gravity: [0.0, 0.0, -9.81]

# Contact for grasping (sim-only physics; docs/sim.md "Grasping"). The fingers collide as the jaw boxes (the
# carriage and the prong, arm/geometry.py) in every model variant; these set how they and the objects touch.
contact:
  cone: elliptic                 # friction cone: elliptic | pyramidal
  noslip_iterations: 5           # post-solve iterations that remove creep in held objects
  fingers:
    condim: 4                    # sliding + torsional friction (an object doesn't spin out of the jaws)
    friction: [1.5, 0.02, 0.0001]   # sliding, torsional, rolling (MuJoCo takes the larger of the two geoms')
    solref: [0.004, 1.0]         # stiff jaw contact (time constant s, damping ratio)
    solimp: [0.95, 0.99, 0.001]
    mimic_solref: [0.002, 1.0]   # the right finger's coupling to the left (one pinion drives both)
  objects:
    condim: 4
    friction: [0.8, 0.005, 0.0001]

# The model from the description node: GET /model/bundle.zip with these options (base is always swerve)
model:
  variant: full                  # full: mesh collisions and visuals; simple: one capsule per arm link

floor:
  friction: [1.0, 0.005, 0.0001] # sliding, torsional, rolling
  size: 20.0                     # m, half side

# The base: the decided kinematic-dynamic hybrid (docs/plans/sim_v1.md, "Decided" 3). Each module's steer and
# wheel are stiff servos whose setpoints follow the SPARK setpoints; the chassis is a free body moved by wheel-floor
# friction. Every LIMIT (steer rate, wheel speed and acceleration, torques) comes from the robot's own config
# (swerve/constants.py as setup_sparks.py configures the SPARKs: nodes/sim/limits.py), never from this file.
base:
  steer: {kp: 300.0, kv: 6.0, armature: 0.02}    # servo stiffness / damping (sim only)
  wheel: {kv: 4.0, armature: 0.01}
  # Module compliance: soft wheel-floor contact so all four wheels stay loaded (solref: time constant, damping ratio)
  wheel_contact: {friction: [1.0, 0.01, 0.0001], solref: [0.02, 1.0], solimp: [0.9, 0.95, 0.002]}
  start: {xyz: [0.0, 0.0, 0.0], yaw: 0.0}

# Fidelity per component: kinematic (ideal tracking within the speed limits) | dynamic (not built yet)
components:
  arm:
    fidelity: kinematic
    # joint speed caps and the gripper's force cap: the arm node's hard limits (arm/config.py), not set here
    servo: {kp: 800.0, kv: 30.0} # the stiff servo that makes the kinematic reference physical (loads the chassis)
    gripper_speed: 6.0           # rad/s of the gripper motor: a PHYSICAL ESTIMATE (the robot configures none: the
                                 # node sends the goal through MIT PD; ~0.5 s full stroke as seen on the robot)
    reply_latency: 0.007         # s, reported as the bus's reply latency (measured median on the robot)
    watchdog: 0.1                # s without an MIT frame while enabled -> status 0xD (the Damiao motors' CAN timeout,
                                 # as the arm node expects it: node.py LATE_WARN)
    start_q: [0.0, -0.3, -0.6, 0.0, 0.0, 0.0]

# Cameras (rendered offscreen): link = the model link the image is taken from (optical frame: x right, y down,
# z out of the lens). Profiles as the camera node's catalog keys; delay = camera-to-host latency (measured).
cameras:
  camera:
    serial: SIMHEAD0001
    color: {link: camera_color_optical, width: 640, height: 480, fps: 30, fovy_deg: 65.0, delay: 0.030}
    depth: {link: camera_depth_optical, width: 640, height: 400, fps: 30, fovy_deg: 65.0, delay: 0.017}
    depth_range: [0.15, 10.0]    # m; outside reads 0 (no depth)
    jpeg_quality: 80
    # the camera's IMU (accelerometer + gyro, 1 kHz, every physics step): MuJoCo sensors at the link's origin, in its
    # frame (the depth optical frame: x right, y down, z forward; at rest accel = (0, -9.81, 0) when level)
    imu: {link: camera_depth_optical, delay: 0.002}   # delay: s from sample to host (t_capture - t_sensor)
  wrist_camera:
    serial: SIMWRIST0001
    color: {link: wrist_camera_color_optical, width: 640, height: 480, fps: 30, fovy_deg: 65.0, delay: 0.047}
    depth: {link: wrist_camera_depth_optical, width: 640, height: 400, fps: 30, fovy_deg: 65.0, delay: 0.047}
    depth_range: [0.07, 5.0]
    jpeg_quality: 80

# Camera rendering. Shadows cost most with software OpenGL (OSMesa / llvmpipe in Docker: full model 540 -> 170 ms
# per 640x480 frame without them); keep them on a GPU.
render:
  shadows: true
  reflections: true

# The scene at start (POST /scene/reset puts the objects back where they were added; {start: true} reloads this):
# tabletop: the default tabletop scene (scene.py: a fixed table in reach of the arm, graspable objects on it, two on
# the floor), then objects: box (size: full x, y, z) or cylinder (radius, length along z); mass kg; pose xyz + yaw
# (or rpy); fixed: true welds it to the world (furniture).
scene:
  tabletop: true
  objects: []

# Watchdogs: the robot's own (the arm's components.arm.watchdog, the SPARKs' 0.1 s heartbeat), or longer ones when
# lenient. auto = lenient on macOS: no real-time scheduling, and under load the arm node's ticks arrive 90-140 ms
# apart (measured 2026-11-24), past the motors' 0.1 s: every joint faulted. Forgives stalls only. false on a Linux
# sim host to keep the robot's timing.
timing:
  lenient: auto                  # auto | true | false
  arm_watchdog: 0.5              # s, when lenient
  swerve_heartbeat: 0.5          # s, when lenient

time:
  run: true                      # start running in real time (false: paused, advanced by POST /step)
  rtf: 1.0                       # real-time factor
