<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot nodes</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1b1f24; --muted: #646b75; --line: #d9dde3;
    --ok: #18794e; --ok-bg: #e3f5ea; --bad: #c4231c; --bad-bg: #fde8e7;
    --warn: #9a5b00; --warn-bg: #fff2d6; --off: #8a919b; --off-bg: #eceef1; --link: #0b5cad;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --panel: #1b1e23; --text: #e6e8eb; --muted: #9aa1ab; --line: #2d3239;
      --ok: #4cc38a; --ok-bg: #12301f; --bad: #ff6b5f; --bad-bg: #3a1513;
      --warn: #f0b44c; --warn-bg: #352812; --off: #7d848e; --off-bg: #23272d; --link: #6cb0ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 16px; }
  header h1 { font-size: 20px; margin: 0; flex: 1 1 auto; }
  header .sub { color: var(--muted); font-size: 13px; font-weight: normal; display: block; }
  #restart { font: 600 12px system-ui, sans-serif; padding: 2px 10px; border-radius: 6px; cursor: pointer;
             border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  #restart:disabled { opacity: .5; cursor: default; }
  #restart-msg.err { color: var(--bad); font-weight: 600; }

  #estop { flex: 0 0 auto; min-width: 220px; padding: 18px 28px; border: 3px solid #7a0d08;
           border-radius: 12px; background: #d7261e; color: #fff; cursor: pointer;
           font: 800 24px/1 system-ui, sans-serif; letter-spacing: .06em;
           box-shadow: 0 3px 0 #7a0d08; }
  #estop:hover { background: #e8342b; }
  #estop:active { transform: translateY(2px); box-shadow: 0 1px 0 #7a0d08; }
  #estop:focus-visible { outline: 4px solid #ffcc00; outline-offset: 2px; }
  #estop small { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0; margin-top: 6px; opacity: .9; }

  #estop-result { display: none; margin-bottom: 16px; padding: 12px 14px; border-radius: 10px;
                  border: 2px solid var(--line); background: var(--panel); }
  #estop-result.show { display: block; }
  #estop-result.good { border-color: var(--ok); }
  #estop-result.bad { border-color: var(--bad); background: var(--bad-bg); }
  #estop-result h2 { margin: 0 0 8px; font-size: 16px; }
  #estop-result ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  #estop-result li { display: flex; gap: 10px; align-items: baseline; }
  #estop-result .detail { color: var(--muted); font-size: 13px; }

  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--off);
          border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .tile.up { border-left-color: var(--ok); }
  .tile.down { border-left-color: var(--bad); }
  .tile.latched { border-left-color: var(--bad); background: var(--bad-bg); }
  .tile .head { display: flex; align-items: baseline; gap: 8px; }
  .tile .title { font-weight: 700; font-size: 17px; flex: 1 1 auto; overflow-wrap: anywhere; }
  .tile .kind { color: var(--muted); font-size: 12px; }
  .tile dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 0; font-size: 14px; }
  .tile dt { color: var(--muted); }
  .tile dd { margin: 0; overflow-wrap: anywhere; }
  .tile .err { color: var(--bad); font-weight: 600; }
  .tile .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px;
                margin-top: auto; padding-top: 6px; border-top: 1px solid var(--line); font-size: 13px; }
  .tile .foot .age { color: var(--muted); }
  .tile a.open { color: var(--link); font-weight: 600; text-decoration: none; }
  .tile a.open:hover { text-decoration: underline; }

  .tile .ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; }
  .tile .ctl:empty { display: none; }
  .tile .ctl button { font: 600 13px system-ui, sans-serif; padding: 4px 12px; border-radius: 6px;
                      border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  .tile .ctl button.go { border-color: var(--ok); color: var(--ok); }
  .tile .ctl button.stop { border-color: var(--bad); color: var(--bad); }
  .tile .ctl button:disabled { opacity: .45; cursor: default; }
  .tile .ctl a { color: var(--link); cursor: pointer; text-decoration: none; }
  .tile .ctl .msg { flex-basis: 100%; color: var(--muted); }
  .tile .ctl .msg.err { color: var(--bad); font-weight: 600; }
  .tile pre.logs { margin: 0; max-height: 160px; overflow: auto; font: 11px/1.35 ui-monospace, monospace;
                   background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 700;
          white-space: nowrap; background: var(--off-bg); color: var(--off); }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.bad { background: var(--bad); color: #fff; }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }

  #planned, #note { color: var(--muted); font-size: 13px; margin-top: 16px; }
  #tools-section h2 { font-size: 17px; margin: 24px 0 8px; }
  #tools { list-style: none; margin: 0; padding: 0; display: grid;
           grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  #tools a { display: block; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line);
             border-radius: 10px; color: var(--text); text-decoration: none; }
  #tools a:hover { border-color: var(--link); }
  #tools strong { color: var(--link); }
  #tools span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  #empty { color: var(--muted); }
  @media (max-width: 520px) {
    #estop { width: 100%; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Robot nodes <span class="sub"><span id="where"></span>
      · <button id="restart" type="button" title="Restart this landing page (robot-frontend.service): reloads nodes.yaml and the code. Running nodes keep running.">Restart landing page</button>
      <span id="restart-msg"></span></span></h1>
    <button id="estop" type="button" aria-label="E-STOP ALL" title="POST estop to every actuated node, in parallel">
      E-STOP ALL<small>every actuated node</small>
    </button>
  </header>
  <section id="estop-result" aria-live="assertive"></section>
  <section id="grid" aria-live="polite"><p id="empty">Loading node list…</p></section>
  <p id="planned"></p>
  <section id="tools-section" hidden>
    <h2>Tools</h2>
    <ul id="tools"></ul>
  </section>
  <p id="note">This page only indexes the nodes. Each node keeps running, and keeps its own page
    and e-stop, without it.</p>
</main>
<script>
"use strict";
const POLL_MS = 1000, POLL_TIMEOUT_MS = 900, ESTOP_TIMEOUT_MS = 1500;
const nodes = [];  // {cfg, meta, state, up, err, lastOk, busy, ui}

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  Object.assign(e, props || {});
  for (const k of kids) if (k != null) e.append(k);
  return e;
}

// Every node is on this page's origin at nodes/<name>/ (the robot's port-80 proxy maps it to the
// node's unix socket; docs/nodes.md), so polling, E-STOP and "Open page" are all same-origin.
function proxyBase(n) {
  return new URL("nodes/" + encodeURIComponent(n.cfg.name) + "/", location.href).href;
}
function endpoint(n, key) {
  const eps = (n.meta && n.meta.endpoints) || {};
  return new URL(typeof eps[key] === "string" && eps[key] ? eps[key] : key, proxyBase(n)).href;
}
// Mirrors estop_path() in app.py: null = /meta says there is nothing to stop.
function estopPath(meta) {
  if (!meta || typeof meta !== "object") return "estop";
  const eps = (meta.endpoints && typeof meta.endpoints === "object") ? meta.endpoints : {};
  if (typeof eps.estop === "string" && eps.estop) return eps.estop;
  if (meta.actuated === true) return "estop";
  if (meta.actuated === false || "estop" in eps) return null;
  return "estop";
}

async function fetchJson(url, opts, timeoutMs) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const r = await fetch(url, Object.assign({ signal: ctl.signal, cache: "no-store" }, opts));
    let body = null;
    try { body = await r.json(); } catch (_) { /* not JSON */ }
    return { status: r.status, ok: r.ok, body };
  } finally {
    clearTimeout(timer);
  }
}
function netError(e) {
  return e && e.name === "AbortError" ? "timed out" : "no response";
}

function makeTile(n) {
  const ui = {};
  ui.title = h("span", { className: "title", textContent: n.cfg.name });
  ui.pill = h("span", { className: "pill", textContent: "…" });
  ui.kind = h("div", { className: "kind", textContent: "/nodes/" + n.cfg.name + "/" });
  ui.dl = h("dl");
  ui.link = h("a", { className: "open", textContent: "Open page →" });
  ui.age = h("span", { className: "age" });
  ui.ctl = h("div", { className: "ctl" });
  ui.logs = h("pre", { className: "logs", hidden: true });
  ui.root = h("article", { className: "tile" },
    h("div", { className: "head" }, ui.title, ui.pill), ui.kind, ui.dl, ui.ctl, ui.logs,
    h("div", { className: "foot" }, ui.age, ui.link));
  return ui;
}

function row(dl, label, value, cls) {
  dl.append(h("dt", { textContent: label }), h("dd", { className: cls || "" }, value));
}

function render(n) {
  const ui = n.ui, m = n.meta || {}, s = n.state || {};
  ui.title.textContent = m.title || n.cfg.name;
  const kindBits = [m.kind || n.cfg.kind, m.version && "v" + m.version,
                    n.cfg.host ? n.cfg.host + ":" + n.cfg.port : "/nodes/" + n.cfg.name + "/"];
  ui.kind.textContent = kindBits.filter(Boolean).join(" · ");
  const latched = !!(n.up && s.estop && s.estop.latched);
  ui.root.className = "tile " + (n.up === undefined ? "" : n.up ? "up" : "down") + (latched ? " latched" : "");
  ui.pill.className = "pill " + (n.up === undefined ? "" : n.up ? "ok" : "bad");
  ui.pill.textContent = n.up === undefined ? "…" : n.up ? "UP" : "DOWN";

  ui.dl.replaceChildren();
  if (n.up) {
    row(ui.dl, "state", s.state != null ? String(s.state) : "—");
    if (s.error) row(ui.dl, "error", String(s.error), "err");
    if (s.lease && typeof s.lease === "object") {
      row(ui.dl, "lease", s.lease.held ? h("span", { className: "pill warn", textContent: s.lease.holder || "held" })
                                       : h("span", { className: "pill", textContent: "free" }));
    }
    if (s.estop && typeof s.estop === "object") {
      row(ui.dl, "e-stop", s.estop.latched ? h("span", { className: "pill bad", textContent: "LATCHED" })
                                           : h("span", { className: "pill ok", textContent: "clear" }));
    }
  } else if (n.up === false) {
    row(ui.dl, "status", n.err || "unreachable", "err");
  }

  if (m.has_page === false) {
    ui.link.removeAttribute("href");
    ui.link.textContent = "no page";
  } else {
    ui.link.href = new URL(typeof m.page === "string" && m.page ? m.page : "./", proxyBase(n)).href;
    ui.link.textContent = "Open page →";
  }
  ui.age.textContent = n.lastOk ? "updated " + ((Date.now() - n.lastOk) / 1000).toFixed(1) + " s ago" : "never reached";
  renderControls(n);
}

// -- start / stop (api/nodes/<name>/start|stop; systemd user unit robot-node-<name>) -------
const START_NOTES = { camera: "Keep the robot still for ~2 s after start (IMU calibration)." };

function renderControls(n) {
  const ui = n.ui, m = n.managed;
  ui.ctl.replaceChildren();
  if (!m || !m.startable) return;
  const st = m.managed.state, busy = n.ctlBusy;
  const pills = { running: ["managed: running", "ok"], starting: ["managed: starting…", "warn"],
                  stopping: ["managed: stopping…", "warn"],
                  failed: ["managed: failed" + (m.managed.result ? " (" + m.managed.result + ")" : ""), "bad"] };
  let pill = pills[st];
  if (!pill) pill = m.listening ? ["running (not managed)", ""] : ["stopped", ""];
  ui.ctl.append(h("span", { className: "pill " + pill[1], textContent: pill[0] }));
  if (st === "running" || st === "starting") {
    ui.ctl.append(h("button", { className: "stop", textContent: "Stop", disabled: busy,
                                onclick: () => control(n, "stop") }));
  } else {
    const blocked = m.listening && st !== "stopping";
    ui.ctl.append(h("button", { className: "go", textContent: "Start", disabled: busy || blocked || st === "stopping",
                                title: blocked ? "Already running outside the landing page (e.g. in a terminal)" : "",
                                onclick: () => control(n, "start") }));
  }
  ui.ctl.append(h("a", { textContent: ui.logs.hidden ? "logs" : "hide logs", onclick: () => toggleLogs(n) }));
  if (n.ctlMsg) ui.ctl.append(h("span", { className: "msg" + (n.ctlErr ? " err" : ""), textContent: n.ctlMsg }));
}

async function control(n, action) {
  n.ctlBusy = true; n.ctlErr = false;
  n.ctlMsg = action === "start" ? "starting… " + (START_NOTES[(n.meta && n.meta.kind) || n.cfg.name] || "")
                                : "stopping…";
  renderControls(n);
  try {
    const r = await fetchJson("api/nodes/" + encodeURIComponent(n.cfg.name) + "/" + action,
                              { method: "POST" }, 25000);
    if (r.ok) { n.managed = r.body; n.ctlMsg = action === "start" ? (START_NOTES[(n.meta && n.meta.kind) || n.cfg.name] || "") : ""; }
    else { n.ctlErr = true; n.ctlMsg = (r.body && r.body.detail) || "HTTP " + r.status; }
  } catch (e) {
    n.ctlErr = true; n.ctlMsg = action + ": " + netError(e);
  } finally {
    n.ctlBusy = false;
    renderControls(n);
    if (!n.ui.logs.hidden) loadLogs(n);
  }
}

async function loadLogs(n) {
  try {
    const r = await fetchJson("api/nodes/" + encodeURIComponent(n.cfg.name) + "/logs?lines=30", {}, 5000);
    const lines = (r.ok && r.body && r.body.lines) || [];
    n.ui.logs.textContent = lines.length ? lines.join("\n") : "(no log lines)";
    n.ui.logs.scrollTop = n.ui.logs.scrollHeight;
  } catch (e) { n.ui.logs.textContent = "logs: " + netError(e); }
}
function toggleLogs(n) {
  n.ui.logs.hidden = !n.ui.logs.hidden;
  if (!n.ui.logs.hidden) loadLogs(n);
  renderControls(n);
}

async function pollManaged() {
  try {
    const r = await fetchJson("api/managed", {}, 3000);
    if (!r.ok || !r.body) return;
    for (const m of r.body.nodes || []) {
      const n = nodes.find(x => x.cfg.name === m.name);
      if (!n) continue;
      const failedNow = m.managed.state === "failed" && (!n.managed || n.managed.managed.state !== "failed");
      n.managed = m;
      if (failedNow && n.ui.logs.hidden) toggleLogs(n);   // show why it died
      else if (!n.ui.logs.hidden && m.managed.state !== "stopped") loadLogs(n);
      if (!n.ctlBusy) renderControls(n);
    }
  } catch (_) { /* frontend unreachable: the tiles say so */ }
}

async function poll(n) {
  if (n.busy) return;
  n.busy = true;
  try {
    if (!n.meta) {
      const r = await fetchJson(new URL("meta", proxyBase(n)).href, {}, POLL_TIMEOUT_MS);
      n.meta = r.ok && r.body && typeof r.body === "object" ? r.body : {};  // {} = no usable /meta
    }
    const r = await fetchJson(endpoint(n, "state"), {}, POLL_TIMEOUT_MS);
    if (r.status === 502) throw new Error("state: " + ((r.body && r.body.detail) || "node unreachable"));
    if (!r.ok) throw new Error("state: HTTP " + r.status);
    n.state = r.body || {};
    n.up = true; n.err = null; n.lastOk = Date.now();
  } catch (e) {
    n.up = false;
    n.err = e instanceof Error && e.message.startsWith("state:") ? e.message : netError(e);
    n.meta = null;  // re-read /meta when it comes back (it may have restarted as something new)
  } finally {
    n.busy = false;
    render(n);
  }
}

async function estopOne(n) {
  const path = estopPath(n.meta);
  if (path === null) return { status: "skipped", detail: "not actuated" };
  try {
    const r = await fetchJson(new URL(path, proxyBase(n)).href, { method: "POST" }, ESTOP_TIMEOUT_MS);
    if (!r.ok) return { status: "failed", detail: "HTTP " + r.status };
    if (r.body && r.body.latched === true) return { status: "latched", detail: "" };
    return { status: "failed", detail: "reply did not confirm latched" };
  } catch (e) {
    return { status: "unreachable", detail: netError(e) };
  }
}

async function estopAll() {
  const box = document.getElementById("estop-result");
  box.className = "show bad";
  box.replaceChildren(h("h2", { textContent: "E-STOP sent…" }));
  const targets = nodes.slice();
  const results = await Promise.all(targets.map(estopOne));
  const attempted = results.filter(r => r.status !== "skipped");
  const latched = attempted.filter(r => r.status === "latched").length;
  const good = attempted.length > 0 && latched === attempted.length;
  const when = new Date().toLocaleTimeString();
  box.className = "show " + (good ? "good" : "bad");
  const title = good
    ? `E-STOP latched on all ${latched} actuated node${latched === 1 ? "" : "s"} (${when})`
    : attempted.length === 0
      ? `E-STOP: no actuated node found to stop (${when}). Use each node's own e-stop.`
      : `E-STOP NOT CONFIRMED on ${attempted.length - latched} of ${attempted.length} node(s) (${when}). Stop them another way!`;
  // Green = stop confirmed; red = this node may still be moving.
  const pillCls = { latched: "pill ok", failed: "pill bad", unreachable: "pill bad", skipped: "pill" };
  box.replaceChildren(h("h2", { textContent: title }), h("ul", {}, ...targets.map((n, i) => {
    const r = results[i];
    return h("li", {},
      h("span", { className: pillCls[r.status], textContent: r.status.toUpperCase() }),
      h("strong", { textContent: (n.meta && n.meta.title) || n.cfg.name }),
      h("span", { className: "detail", textContent: r.detail }));
  })));
  targets.forEach(poll);
}

async function start() {
  document.getElementById("where").textContent = location.host;
  document.getElementById("estop").addEventListener("click", estopAll);
  document.getElementById("restart").addEventListener("click", restartFrontend);
  let cfg;
  for (;;) {
    try {
      const r = await fetchJson("api/nodes", {}, 3000);
      if (r.ok && r.body && Array.isArray(r.body.nodes)) { cfg = r.body.nodes; break; }
    } catch (_) { /* retry */ }
    document.getElementById("empty").textContent = "Cannot load the node list from this frontend; retrying…";
    await new Promise(res => setTimeout(res, 2000));
  }
  const grid = document.getElementById("grid");
  grid.replaceChildren();
  for (const c of cfg.filter(c => c.enabled !== false)) {
    const n = { cfg: c, meta: null, state: null, up: undefined, err: null, lastOk: 0, busy: false,
                managed: null, ctlBusy: false, ctlMsg: "", ctlErr: false };
    n.ui = makeTile(n);
    grid.append(n.ui.root);
    nodes.push(n);
    render(n);
  }
  if (!nodes.length) grid.append(h("p", { id: "empty", textContent: "No nodes enabled in the frontend's nodes.yaml." }));
  const planned = cfg.filter(c => c.enabled === false);
  document.getElementById("planned").textContent = planned.length
    ? "Planned (disabled in nodes.yaml): " + planned.map(c => c.name).join(", ") : "";
  loadTools();
  pollManaged();
  setInterval(pollManaged, 2000);
  const tick = () => nodes.forEach(poll);
  tick();
  setInterval(tick, POLL_MS);
}
// Restart this frontend's systemd service, wait until the new process answers, reload the page.
async function restartFrontend() {
  const btn = document.getElementById("restart"), msg = document.getElementById("restart-msg");
  btn.disabled = true; msg.className = ""; msg.textContent = "restarting…";
  let before = null;
  try {
    const r = await fetchJson("api/frontend/restart", { method: "POST" }, 5000);
    if (r.status !== 202) {
      msg.className = "err"; msg.textContent = (r.body && r.body.detail) || "HTTP " + r.status;
      btn.disabled = false; return;
    }
    before = r.body.started;
  } catch (e) { msg.className = "err"; msg.textContent = "restart: " + netError(e); btn.disabled = false; return; }
  const deadline = Date.now() + 30000;
  while (Date.now() < deadline) {
    await new Promise(res => setTimeout(res, 500));
    try {
      const r = await fetchJson("api/frontend", {}, 1000);
      if (r.ok && r.body && r.body.started !== before) { location.reload(); return; }
    } catch (_) { /* down while it restarts */ }
  }
  msg.className = "err"; msg.textContent = "did not come back within 30 s (journalctl --user -u robot-frontend)";
  btn.disabled = false;
}

async function loadTools() {
  try {
    const r = await fetchJson("api/tools", {}, 3000);
    const tools = (r.ok && r.body && r.body.tools) || [];
    const ul = document.getElementById("tools");
    ul.replaceChildren(...tools.map(t => h("li", {}, h("a", { href: t.href },
      h("strong", { textContent: t.title }), h("span", { textContent: t.description })))));
    document.getElementById("tools-section").hidden = tools.length === 0;
  } catch (_) { /* no tools section */ }
}
start();
</script>
</body>
</html>
