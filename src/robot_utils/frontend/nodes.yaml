# Node instances shown on the robot's landing page (python -m robot_utils.frontend).
#
# One entry per node process. Adding an instance = adding a line here; no code changes, no proxy
# change: the robot's port-80 proxy maps http://<robot>/nodes/<name>/ to the unix socket
# <runtime dir>/robot/<name>.sock, which the node opens itself (--name <name>).
#   name:    instance name: socket, URL path, tile title until the node's /meta answers
#   kind:    optional, default = name: what the node is (camera, swerve, estimator, ...)
#   start:   optional; lets the landing page start/stop the instance: {module: ..., args: [...]}
#            runs `python -m <module> --name <name> <args>` with the frontend's interpreter (the
#            robot venv) as the systemd user unit robot-node-<name>. The frontend refuses to
#            start an instance whose socket already answers (e.g. started by hand) and only
#            stops its own units. A second camera, e.g.:
#              {name: camera2, kind: camera, start: {module: robot_utils.nodes.orbbec, args: [...]}}
#   enabled: optional, default true; false = listed as "planned", not polled, not e-stopped
#   boot:    optional, default false; true = a persistent user unit that starts at boot (needs start:;
#            python -m robot_utils.frontend.boot, run by install.sh, writes and enables it)
#   port:    optional; for a local instance, a debug TCP port it was told to open (--port);
#   host:    with port, for a node on another machine (reached through the frontend's proxy)
#
# Override with: python -m robot_utils.frontend --config /path/to/nodes.yaml
nodes:
  - {name: camera, kind: camera, start: {module: robot_utils.nodes.orbbec}}
  - {name: swerve, kind: swerve, start: {module: robot_utils.nodes.swerve}}
  # power: the UPS HAT (and later the main / aux batteries); replaced ~/ups-dashboard (docs/power.md).
  # boot: its low-voltage shutdown must run without anyone pressing Start (frontend/boot.py)
  - {name: power, kind: power, boot: true, start: {module: robot_utils.nodes.power}}
  # arm: the reBot Arm B601-DM on its serial bridge (docs/arm.md). Starting it moves nothing: the
  # motors stay off until a lease holder enables it (the first enable closes the gripper to check it).
  - {name: arm, kind: arm, start: {module: robot_utils.nodes.arm}}
  - {name: estimator, kind: estimator, start: {module: robot_utils.nodes.estimator}}
  - {name: description, kind: description, start: {module: robot_utils.nodes.description}}
  - {name: pose_servo, kind: pose_servo, start: {module: robot_utils.nodes.pose_servo}}
  - {name: 3d_perception, kind: 3d_perception, start: {module: robot_utils.nodes.perception3d}}
  # agent: Agent MoMa, the agent-facing node for mobile manipulation (docs/agent.md). agent_nav is its frozen
  # predecessor (docs/agent_nav.md): kept for old briefs and episodes, not maintained; start it only for those.
  - {name: agent, kind: agent, start: {module: robot_utils.nodes.agent}}
  - {name: agent_nav, kind: agent_nav, start: {module: robot_utils.nodes.agent_nav}}
